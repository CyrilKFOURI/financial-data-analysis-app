[project]
name = "fda-demo"
version = "0.1.0"
description = "Static online demo: the analytics engine in the browser (Pyodide) over exported inputs"
requires-python = ">=3.12"
dependencies = ["fda-core", "fda-contracts", "pandas>=2.2", "numpy>=2.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# SEC companyfacts → canonical line items (BACKEND_SCHEMA §4.4). For each period the first
# tag in the list that reports a value wins. `negate: true` flips the sign into the
# canonical convention (capex, dividends, buybacks are positive outflows).
version: 2
unit_default: USD
items:
  revenue: [us-gaap:RevenueFromContractWithCustomerExcludingAssessedTax, us-gaap:Revenues, us-gaap:SalesRevenueNet, us-gaap:RevenueFromContractWithCustomerIncludingAssessedTax, us-gaap:RevenuesNetOfInterestExpense]
  cost_of_revenue: [us-gaap:CostOfGoodsAndServicesSold, us-gaap:CostOfRevenue, us-gaap:CostOfGoodsSold, us-gaap:CostOfServices]
  gross_profit: [us-gaap:GrossProfit]
  rnd: [us-gaap:ResearchAndDevelopmentExpense, us-gaap:ResearchAndDevelopmentExpenseExcludingAcquiredInProcessCost]
  sga: [us-gaap:SellingGeneralAndAdministrativeExpense]
  operating_expenses: [us-gaap:OperatingExpenses, us-gaap:CostsAndExpenses]
  operating_income: [us-gaap:OperatingIncomeLoss]
  d_and_a: [us-gaap:DepreciationDepletionAndAmortization, us-gaap:DepreciationAndAmortization, us-gaap:DepreciationAmortizationAndAccretionNet, us-gaap:Depreciation]
  interest_expense: [us-gaap:InterestExpense, us-gaap:InterestExpenseNonoperating, us-gaap:InterestExpenseDebt]
  interest_income: [us-gaap:InvestmentIncomeInterest, us-gaap:InterestIncomeOther]
  other_non_operating: [us-gaap:NonoperatingIncomeExpense, us-gaap:OtherNonoperatingIncomeExpense]
  pretax_income: [us-gaap:IncomeLossFromContinuingOperationsBeforeIncomeTaxesExtraordinaryItemsNoncontrollingInterest, us-gaap:IncomeLossFromContinuingOperationsBeforeIncomeTaxesMinorityInterestAndIncomeLossFromEquityMethodInvestments]
  income_tax: [us-gaap:IncomeTaxExpenseBenefit]
  net_income: [us-gaap:ProfitLoss, us-gaap:NetIncomeLoss]
  minority_interest_is: [us-gaap:NetIncomeLossAttributableToNoncontrollingInterest]
  net_income_common: [us-gaap:NetIncomeLossAvailableToCommonStockholdersBasic, us-gaap:NetIncomeLoss]
  eps_basic: {tags: [us-gaap:EarningsPerShareBasic], unit: USD/shares}
  eps_diluted: {tags: [us-gaap:EarningsPerShareDiluted], unit: USD/shares}
  shares_basic_wavg: {tags: [us-gaap:WeightedAverageNumberOfSharesOutstandingBasic], unit: shares}
  shares_diluted_wavg: {tags: [us-gaap:WeightedAverageNumberOfDilutedSharesOutstanding], unit: shares}
  sbc: [us-gaap:ShareBasedCompensation, us-gaap:AllocatedShareBasedCompensationExpense]
  cash_and_equivalents: [us-gaap:CashAndCashEquivalentsAtCarryingValue, us-gaap:CashCashEquivalentsRestrictedCashAndRestrictedCashEquivalents, us-gaap:Cash]
  short_term_investments: [us-gaap:MarketableSecuritiesCurrent, us-gaap:ShortTermInvestments, us-gaap:AvailableForSaleSecuritiesDebtSecuritiesCurrent]
  receivables: [us-gaap:AccountsReceivableNetCurrent, us-gaap:ReceivablesNetCurrent]
  inventory: [us-gaap:InventoryNet]
  other_current_assets: [us-gaap:OtherAssetsCurrent]
  total_current_assets: [us-gaap:AssetsCurrent]
  ppe_net: [us-gaap:PropertyPlantAndEquipmentNet, us-gaap:PropertyPlantAndEquipmentAndFinanceLeaseRightOfUseAssetAfterAccumulatedDepreciationAndAmortization]
  goodwill: [us-gaap:Goodwill]
  intangibles: [us-gaap:IntangibleAssetsNetExcludingGoodwill, us-gaap:FiniteLivedIntangibleAssetsNet]
  other_non_current_assets: [us-gaap:OtherAssetsNoncurrent]
  total_assets: [us-gaap:Assets]
  accounts_payable: [us-gaap:AccountsPayableCurrent]
  short_term_debt: [us-gaap:CommercialPaper, us-gaap:ShortTermBorrowings]
  current_portion_lt_debt: [us-gaap:LongTermDebtCurrent]
  other_current_liabilities: [us-gaap:OtherLiabilitiesCurrent]
  total_current_liabilities: [us-gaap:LiabilitiesCurrent]
  long_term_debt: [us-gaap:LongTermDebtNoncurrent, us-gaap:LongTermDebt, us-gaap:LongTermDebtAndCapitalLeaseObligations]
  operating_lease_liabilities: [us-gaap:OperatingLeaseLiabilityNoncurrent]
  other_non_current_liabilities: [us-gaap:OtherLiabilitiesNoncurrent]
  total_liabilities: [us-gaap:Liabilities]
  preferred_equity: [us-gaap:PreferredStockValue]
  common_equity: [us-gaap:StockholdersEquity]
  retained_earnings: [us-gaap:RetainedEarningsAccumulatedDeficit]
  minority_interest_bs: [us-gaap:MinorityInterest]
  total_equity: [us-gaap:StockholdersEquityIncludingPortionAttributableToNoncontrollingInterest, us-gaap:StockholdersEquity]
  total_liabilities_and_equity: [us-gaap:LiabilitiesAndStockholdersEquity]
  shares_outstanding: {tags: [dei:EntityCommonStockSharesOutstanding, us-gaap:CommonStockSharesOutstanding], unit: shares}
  cfo: [us-gaap:NetCashProvidedByUsedInOperatingActivities, us-gaap:NetCashProvidedByUsedInOperatingActivitiesContinuingOperations]
  capex: [us-gaap:PaymentsToAcquirePropertyPlantAndEquipment, us-gaap:PaymentsToAcquireProductiveAssets]
  acquisitions: [us-gaap:PaymentsToAcquireBusinessesNetOfCashAcquired]
  cfi: [us-gaap:NetCashProvidedByUsedInInvestingActivities, us-gaap:NetCashProvidedByUsedInInvestingActivitiesContinuingOperations]
  dividends_paid: [us-gaap:PaymentsOfDividends, us-gaap:PaymentsOfDividendsCommonStock, us-gaap:PaymentsOfOrdinaryDividends]
  buybacks: [us-gaap:PaymentsForRepurchaseOfCommonStock]
  share_issuance: [us-gaap:ProceedsFromIssuanceOfCommonStock]
  debt_issued: [us-gaap:ProceedsFromIssuanceOfLongTermDebt, us-gaap:ProceedsFromIssuanceOfDebt]
  debt_repaid: [us-gaap:RepaymentsOfLongTermDebt, us-gaap:RepaymentsOfDebt]
  cff: [us-gaap:NetCashProvidedByUsedInFinancingActivities, us-gaap:NetCashProvidedByUsedInFinancingActivitiesContinuingOperations]
  fx_effect: [us-gaap:EffectOfExchangeRateOnCashCashEquivalentsRestrictedCashAndRestrictedCashEquivalents, us-gaap:EffectOfExchangeRateOnCashAndCashEquivalents]
  net_change_cash: [us-gaap:CashCashEquivalentsRestrictedCashAndRestrictedCashEquivalentsPeriodIncreaseDecreaseIncludingExchangeRateEffect, us-gaap:CashAndCashEquivalentsPeriodIncreaseDecrease]
  debt_maturity_y1: [us-gaap:LongTermDebtMaturitiesRepaymentsOfPrincipalInNextTwelveMonths]
  debt_maturity_y2: [us-gaap:LongTermDebtMaturitiesRepaymentsOfPrincipalInYearTwo]
  debt_maturity_y3: [us-gaap:LongTermDebtMaturitiesRepaymentsOfPrincipalInYearThree]
  debt_maturity_y4: [us-gaap:LongTermDebtMaturitiesRepaymentsOfPrincipalInYearFour]
  debt_maturity_y5: [us-gaap:LongTermDebtMaturitiesRepaymentsOfPrincipalInYearFive]
  debt_maturity_after_y5: [us-gaap:LongTermDebtMaturitiesRepaymentsOfPrincipalAfterYearFive]
  employees: {tags: [dei:EntityNumberOfEmployees], unit: pure}

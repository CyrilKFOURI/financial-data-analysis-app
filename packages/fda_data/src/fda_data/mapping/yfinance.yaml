# yfinance statement rows → canonical line items (fallback for non-US issuers).
# yfinance reports outflows as negatives: `negate` turns them into canonical positive outflows.
version: 1
items:
  revenue: [Total Revenue, Operating Revenue]
  cost_of_revenue: [Cost Of Revenue, Reconciled Cost Of Revenue]
  gross_profit: [Gross Profit]
  rnd: [Research And Development]
  sga: [Selling General And Administration]
  operating_expenses: [Operating Expense]
  operating_income: [Operating Income, Total Operating Income As Reported]
  d_and_a: [Reconciled Depreciation, Depreciation And Amortization In Income Statement]
  interest_expense: [Interest Expense, Interest Expense Non Operating]
  interest_income: [Interest Income, Interest Income Non Operating]
  other_non_operating: [Other Non Operating Income Expenses]
  pretax_income: [Pretax Income]
  income_tax: [Tax Provision]
  net_income: [Net Income Including Noncontrolling Interests, Net Income]
  minority_interest_is: [Minority Interests]
  net_income_common: [Net Income Common Stockholders, Net Income]
  eps_basic: [Basic EPS]
  eps_diluted: [Diluted EPS]
  shares_basic_wavg: [Basic Average Shares]
  shares_diluted_wavg: [Diluted Average Shares]
  sbc: [Stock Based Compensation]
  cash_and_equivalents: [Cash And Cash Equivalents]
  short_term_investments: [Other Short Term Investments]
  receivables: [Accounts Receivable, Receivables]
  inventory: [Inventory]
  other_current_assets: [Other Current Assets]
  total_current_assets: [Current Assets]
  ppe_net: [Net PPE]
  goodwill: [Goodwill]
  intangibles: [Other Intangible Assets]
  other_non_current_assets: [Other Non Current Assets]
  total_assets: [Total Assets]
  accounts_payable: [Accounts Payable]
  short_term_debt: [Current Debt]
  other_current_liabilities: [Other Current Liabilities]
  total_current_liabilities: [Current Liabilities]
  long_term_debt: [Long Term Debt]
  operating_lease_liabilities: [Long Term Capital Lease Obligation]
  total_liabilities: [Total Liabilities Net Minority Interest]
  common_equity: [Stockholders Equity, Common Stock Equity]
  retained_earnings: [Retained Earnings]
  minority_interest_bs: [Minority Interest]
  total_equity: [Total Equity Gross Minority Interest, Stockholders Equity]
  shares_outstanding: [Ordinary Shares Number, Share Issued]
  cfo: [Operating Cash Flow, Cash Flow From Continuing Operating Activities]
  capex: {fields: [Capital Expenditure], negate: true}
  acquisitions: {fields: [Purchase Of Business, Net Business Purchase And Sale], negate: true}
  cfi: [Investing Cash Flow]
  dividends_paid: {fields: [Cash Dividends Paid, Common Stock Dividend Paid], negate: true}
  buybacks: {fields: [Repurchase Of Capital Stock, Common Stock Payments], negate: true}
  share_issuance: [Issuance Of Capital Stock, Common Stock Issuance]
  debt_issued: [Issuance Of Debt, Long Term Debt Issuance]
  debt_repaid: {fields: [Repayment Of Debt, Long Term Debt Payments], negate: true}
  cff: [Financing Cash Flow]
  fx_effect: [Effect Of Exchange Rate Changes]
  net_change_cash: [Changes In Cash]

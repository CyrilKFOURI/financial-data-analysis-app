[project]
name = "fda-data"
version = "0.1.0"
description = "Data providers, normalisers, line-item mapping and lake I/O"
requires-python = ">=3.12"
dependencies = [
    "fda-core",
    "pandas>=2.2",
    "pyarrow>=17",
    "duckdb>=1.1",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "numpy>=2.1",
    "yfinance>=0.2.66",
    "httpx2>=2.16",
    "pyyaml>=6.0",
]

[tool.uv.sources]
fda-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

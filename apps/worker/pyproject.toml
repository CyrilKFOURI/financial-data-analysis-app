[project]
name = "fda-worker"
version = "0.1.0"
description = "arq worker: ingestion, refresh and heavy analyses"
requires-python = ">=3.12"
dependencies = [
    "fda-core",
    "fda-data",
    "arq>=0.26",
]

[tool.uv.sources]
fda-core = { workspace = true }
fda-data = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
